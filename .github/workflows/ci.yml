name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      references:
        description: Run optional public pdfcn comparisons
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  local-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - name: Locate pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: External PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick
      - run: pnpm install --frozen-lockfile
      - run: npx playwright-core install --with-deps chromium
      - run: pnpm check
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: out/**/report.md
  references:
    if: github.event_name == 'workflow_dispatch' && inputs.references
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick
      - run: pnpm install --frozen-lockfile
      - run: npx playwright-core install --with-deps chromium
      - name: Optional comparisons
        run: |
          pnpm e2e:phase3a
          pnpm e2e:phase3b1
          pnpm e2e:phase3b2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-reference-reports
          path: out/**/report.md
